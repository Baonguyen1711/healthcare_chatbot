service: medical-info-service

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}

  environment:
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    CACHE_TABLE: ${self:service}-cache-${self:provider.stage}
    GOOGLE_API_KEY: ${env:GOOGLE_API_KEY}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/*
        - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CACHE_TABLE}

  httpApi:
    cors: true

# ============================================
# PLUGINS
# ============================================
plugins:
  - serverless-offline

# ============================================
# PACKAGE CONFIG
# ============================================
package:
  individually: true
  patterns:
    - "!node_modules/.bin/**"
    - "!node_modules/**/*.md"
    - "!node_modules/**/*.ts"
    - "!node_modules/**/*.map"
    - "!.git/**"
    - "!.gitignore"
    - "!tests/**"
    - "!README.md"
    - "!package-lock.json"

# ============================================
# FUNCTIONS
# ============================================
functions:
  # CHATBOT API
  chat:
    handler: handlers/chat.handler
    timeout: 30
    events:
      - httpApi:
          path: /chat
          method: post

  # ARTICLE EXTRACTION API
  extractArticle:
    handler: handlers/extractArticle.handler
    timeout: 60
    events:
      - httpApi:
          path: /articles/extract
          method: post

  # ARTICLE SEARCH APIs
  searchArticles:
    handler: handlers/searchArticles.handler
    timeout: 30
    events:
      - httpApi:
          path: /articles/search
          method: get

  getArticle:
    handler: handlers/getArticle.handler
    events:
      - httpApi:
          path: /articles/{id}
          method: get

  getByCategory:
    handler: handlers/getByCategory.handler
    events:
      - httpApi:
          path: /articles/category/{category}
          method: get

  getPopular:
    handler: handlers/getPopular.handler
    events:
      - httpApi:
          path: /articles/popular
          method: get

  # LEGACY APIs
  getMedicalInfo:
    handler: handlers/getArticle.handler
    events:
      - httpApi:
          path: /medical-info/{id}
          method: get

  searchMedicalInfo:
    handler: handlers/searchArticles.handler
    timeout: 30
    events:
      - httpApi:
          path: /medical-info/search
          method: get

  getInfoByCategory:
    handler: handlers/getByCategory.handler
    events:
      - httpApi:
          path: /medical-info/category/{category}
          method: get

# ============================================
# RESOURCES (DYNAMODB)
# ============================================
resources:
  Resources:
    ArticlesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: category
            AttributeType: S

        KeySchema:
          - AttributeName: id
            KeyType: HASH

        GlobalSecondaryIndexes:
          - IndexName: CategoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
